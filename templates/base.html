<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lezzet Durağı Bistro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* YENİ RENK PALETİ */
            --primary-color: #ff6b6b; /* İştah açıcı yumuşak kırmızı/mercan */
            --secondary-color: #2d3436; /* Modern Koyu Gri (Siyah yerine) */
            --bg-color: #f7f9fc; /* Göz yormayan çok açık gri */
            --card-bg: #ffffff;
            --text-muted: #636e72;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--secondary-color);
        }

        /* Navbar Modernizasyonu */
        .navbar {
            background-color: var(--card-bg) !important;
            box-shadow: 0 2px 15px rgba(0,0,0,0.04);
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
        .navbar-brand {
            font-weight: 700;
            color: var(--secondary-color) !important;
            font-size: 1.5rem;
        }
        .nav-link {
            color: var(--text-muted) !important;
            font-weight: 500;
            transition: color 0.3s;
        }
        .nav-link:hover, .nav-link.active {
            color: var(--primary-color) !important;
        }

        /* Kart Tasarımları */
        .card {
            background-color: var(--card-bg);
            border: none;
            border-radius: 16px; /* Daha yuvarlak köşeler */
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); /* Çok hafif, modern gölge */
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        /* Kartın üzerine gelince hafif oynasın ama abartı olmasın */
        .menu-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        /* Butonlar */
        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            border-radius: 12px;
            padding: 10px 20px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
        }
        .btn-primary:hover {
            background-color: #ee5253;
            transform: translateY(-1px);
        }
        
        .btn-dark {
            background-color: var(--secondary-color);
            border-radius: 12px;
        }

        /* Form Elemanları */
        .form-control, .form-select {
            background-color: #f1f3f5;
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 12px;
        }
        .form-control:focus, .form-select:focus {
            background-color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.1);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg mb-4 sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">🍽️ Lezzet Durağı</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item"><a class="nav-link active" href="/">Menü</a></li>
                    <li class="nav-item"><a class="nav-link" href="/genel-menu">Tüm Lezzetler</a></li>
                    <li class="nav-item ms-3">
                        <a href="/admin" class="btn btn-sm btn-dark px-4">Personel</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
